name: 搜集候选节点

# 注意职责划分：
#   这里（海外机器）只负责“搜集 + 去重 + 生成候选名单”。
#   可用性判定放在本机（verify_cn.py），用 mihomo 内核按真实协议打被墙目标。
#   原因是本地/海外判定结果差异极大：海外能通的节点在国内可能完全不可用
#   （大量 Cloudflare 边缘 IP，国内连会返回 409 / error 1001）。

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      max_total:
        description: '候选上限'
        required: false
        default: '15000'
      skip_discover:
        description: '跳过“自动搜寻新源”'
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 取出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 自动搜寻新的节点源
        if: ${{ github.event.inputs.skip_discover != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python discover_sources.py

      - name: 搜集并去重，生成候选名单
        env:
          MAX_TOTAL_TEST: ${{ github.event.inputs.max_total || '15000' }}
        run: python fetch_nodes.py

      - name: 生成订阅页
        run: python render_index.py

      - name: 检查产物
        run: |
          set -e
          test -s dist/candidates.yaml || { echo "::error::候选名单为空"; exit 1; }
          python - <<'PY'
          import yaml, json
          d = yaml.safe_load(open("dist/candidates.yaml", encoding="utf-8"))
          n = len(d.get("proxies") or [])
          st = json.load(open("dist/stats.json", encoding="utf-8"))
          print(f"候选 {n} 个，来自 {len(st['sources'])} 个源")
          if n == 0:
              raise SystemExit("::error::候选为 0，本次不更新")
          PY

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist discovered_sources.json
          if git diff --cached --quiet; then
            echo "本次没有变化"
          else
            git commit -m "chore: 搜集候选 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase --autostash || true
            git push
          fi

      - name: 打包网页
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: 部署到 GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v5
